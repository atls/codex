[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[project]
name = "vector-prime"
version = "0.1.0-alpha.2"
description = "Codex profile assessment and native handoff"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.12,<3", "typing-extensions>=4.14,<5"]

[project.scripts]
vp = "vector_prime.entrypoints.cli.assess:main"

[tool.uv.build-backend]
module-name = "vector_prime"
data = { data = "skills" }

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E402"]
