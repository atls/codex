[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[project]
name = "codex-model-fit"
version = "0.1.0"
description = "Codex profile assessment and native handoff"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.12,<3", "typing-extensions>=4.14,<5"]

[project.scripts]
model-fit = "model_fit.entrypoints.cli.assess:main"

[tool.uv.build-backend]
module-name = "model_fit"
data = { data = "skills" }
