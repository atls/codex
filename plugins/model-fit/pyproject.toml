[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-model-fit"
version = "0.1.0"
description = "Codex profile assessment and native handoff"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
model-fit = "model_fit.entrypoints.cli.assess:main"

[tool.setuptools]
packages = ["model_fit", "model_fit.answer", "model_fit.assessment", "model_fit.assessment.exceptions", "model_fit.autoswitch", "model_fit.autoswitch.admission", "model_fit.autoswitch.exceptions", "model_fit.autoswitch.handoff", "model_fit.autoswitch.recommendation", "model_fit.autoswitch.state", "model_fit.entrypoints", "model_fit.entrypoints.cli", "model_fit.entrypoints.hooks", "model_fit.infrastructure", "model_fit.infrastructure.adapters", "model_fit.infrastructure.adapters.codex", "model_fit.infrastructure.adapters.codex.transport", "model_fit.infrastructure.adapters.codex.transport.assessment", "model_fit.infrastructure.adapters.filesystem", "model_fit.infrastructure.adapters.hooks", "model_fit.submission"]
package-dir = { model_fit = "src" }

[tool.setuptools.package-data]
"model_fit.assessment" = ["*.json"]
"model_fit.answer" = ["*.json"]
