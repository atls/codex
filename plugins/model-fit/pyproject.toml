[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-model-fit"
version = "0.1.0"
description = "Codex profile assessment and native handoff"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
model-fit = "model_fit.entrypoints.assessment.cli:main"

[tool.setuptools]
packages = ["model_fit", "model_fit.application", "model_fit.application.assessment", "model_fit.application.assessment.contracts", "model_fit.application.assessment.failures", "model_fit.application.assessment.ports", "model_fit.application.assessment.validation", "model_fit.application.conversation", "model_fit.application.handoff", "model_fit.application.handoff.contracts", "model_fit.application.handoff.failures", "model_fit.application.handoff.ports", "model_fit.application.handoff.requests", "model_fit.entrypoints", "model_fit.entrypoints.assessment", "model_fit.entrypoints.desktop", "model_fit.infrastructure", "model_fit.infrastructure.assessment", "model_fit.infrastructure.assessment.preflight", "model_fit.infrastructure.assessment.sources", "model_fit.infrastructure.audit", "model_fit.infrastructure.codex", "model_fit.infrastructure.codex.conversation", "model_fit.infrastructure.codex.input", "model_fit.infrastructure.codex.transport", "model_fit.infrastructure.handoff", "model_fit.infrastructure.handoff.recommendations", "model_fit.infrastructure.handoff.state"]
package-dir = { model_fit = "src" }

[tool.setuptools.package-data]
"model_fit.application.assessment" = ["*.json"]
"model_fit.infrastructure.assessment" = ["*.json"]
