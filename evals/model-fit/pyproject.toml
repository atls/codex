[project]
name = "codex-model-fit-evals"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["vector-prime", "pillow>=11,<13"]

[tool.uv.sources]
vector-prime = { path = "../..", editable = true }

[dependency-groups]
dev = [
    "jsonschema>=4.26,<5",
    "mypy>=2.4.1",
    "pytest>=9,<10",
    "pyyaml>=6,<7",
]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
pythonpath = ["."]
