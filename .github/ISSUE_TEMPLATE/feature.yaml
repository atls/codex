name: Feature request
description: Suggest a new capability or an improvement to Vector Prime
title: '[Feature] '
type: 'Feature'
assignees:
  - TorinAsakura
body:
  - type: textarea
    id: motivation
    attributes:
      label: What are you trying to do?
      description: Describe the Codex workflow and where Vector Prime falls short today.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What should Vector Prime do?
      description: Give an example of the behavior you want and say whether it applies to explicit assessment, automatic hooks, or both.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or workarounds
      description: If you have a workaround, describe it and explain what is still missing.
