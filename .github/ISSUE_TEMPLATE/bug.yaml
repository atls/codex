name: Bug
description: Report a bug in a plugin, a tool, or the repository
title: '[Bug] '
type: 'Bug'
body:
  - type: textarea
    id: bug-description
    attributes:
      label: What went wrong?
      description: Name the plugin, command, or part of the repository where you hit the bug.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: How can we reproduce it?
      description: Start from a fresh chat or checkout if you can. Include the command or a short example we can run.
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: env
    attributes:
      label: Where did it happen?
      description: Include the OS, the Codex Desktop or CLI version, and the plugin version or commit where relevant.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Error output
      description: Paste the lines that show the failure. Remove tokens and private chat content.
      render: text

  - type: textarea
    id: assets
    attributes:
      label: Screenshots
      description: Add a screenshot if it helps show the bug. Crop or redact private content.
