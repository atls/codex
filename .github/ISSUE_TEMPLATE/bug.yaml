name: Bug
description: Report something that went wrong in Vector Prime
title: '[Bug] '
type: 'Bug'
assignees:
  - TorinAsakura
body:
  - type: textarea
    id: bug-description
    attributes:
      label: What happened?
      description: Describe where it went wrong. For a profile change, include the model and reasoning effort before and after, if known.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Use a short example that can be shared publicly.
      placeholder: |
        1. Open a new Codex Desktop chat.
        2. Select a model and reasoning effort.
        3. Run an explicit assessment or send a request with automatic hooks enabled.
        4. Describe what Vector Prime and Codex did.
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: What did you expect?
      placeholder: For example, I expected a question about the previous answer to keep my current profile.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Error codes or relevant log excerpts
      description: If known, say whether the request was queued and whether it resumed. Share only sanitized excerpts. Remove credentials and private conversation text.
      render: text

  - type: textarea
    id: assets
    attributes:
      label: Screenshots
      description: If this is visible in Codex Desktop, attach a screenshot with private content removed.

  - type: textarea
    id: env
    attributes:
      label: Environment
      placeholder: |
        - OS and version:
        - Codex Desktop and CLI versions:
        - Vector Prime version or commit:
        - Integration (explicit CLI or automatic hooks):
        - Configuration scope, if using hooks:
    validations:
      required: true
