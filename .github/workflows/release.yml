name: Release

on:
  workflow_dispatch:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: vector-prime-release
  cancel-in-progress: false

jobs:
  gate:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      merged: ${{ steps.merge.outputs.merged }}
    steps:
      - id: merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          merged=$(gh api --paginate "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
            --jq '.[] | select(.base.ref == "master" and .merged_at != null) | .merge_commit_sha')
          if grep -Fqx "$GITHUB_SHA" <<< "$merged"; then
            echo 'merged=true' >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: gate
    if: needs.gate.outputs.merged == 'true' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v3.2.0
        id: app-token
        with:
          client-id: ${{ vars.ATLANTIS_SUPER_BOT_CLIENT_ID }}
          private-key: ${{ secrets.ATLANTIS_SUPER_BOT_PRIVATE_KEY }}
      - uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
      - uses: actions/setup-node@v6
        with:
          node-version-file: evals/model-fit/package.json
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.13'
      - run: yarn install --immutable
        working-directory: evals/model-fit
      - name: Adopt the existing alpha history
        run: |
          set -euo pipefail
          if ! git ls-remote --exit-code --heads origin stable >/dev/null; then
            git push origin "$(git rev-parse "v0.1.0-alpha.1^{commit}")":refs/heads/stable
          fi
          note=refs/notes/semantic-release-v0.1.0-alpha.1
          if ! git ls-remote --exit-code origin "$note" >/dev/null; then
            git -c user.name=Atlantis -c user.email=release@users.noreply.github.com \
              notes --ref "$note" add -m '{"channels":["alpha"]}' v0.1.0-alpha.1
            git push origin "$note"
          fi
      - name: Publish alpha
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: ./evals/model-fit/node_modules/.bin/semantic-release
