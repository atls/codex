name: Release

on:
  pull_request_target:
    types: [closed]
    branches: [master]
    paths:
      - 'plugins/**'
      - LICENSE
      - .github/actions/package/**
      - .github/packaging/**
      - .github/workflows/release.yml

permissions:
  contents: write

jobs:
  release:
    if: github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - uses: astral-sh/ruff-action@v4.1.0
        with:
          version: '0.17.2'
          src: plugins/model-fit evals/model-fit
      - run: ruff format --check plugins/model-fit evals/model-fit
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v6
        with:
          node-version-file: evals/model-fit/package.json
      - run: yarn install --immutable
        working-directory: evals/model-fit
      - run: yarn run test
        working-directory: evals/model-fit
      - uses: ./.github/actions/package
        with:
          output: dist
      - name: Read release version
        id: version
        run: echo "value=$(jq -er '.version' plugins/model-fit/.codex-plugin/plugin.json)" >> "$GITHUB_OUTPUT"
      - name: Publish GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: v${{ steps.version.outputs.value }}
          commit: ${{ github.event.pull_request.merge_commit_sha }}
          name: Model Fit v${{ steps.version.outputs.value }}
          artifacts: dist/*.zip
          artifactErrorsFailBuild: true
          allowUpdates: false
          generateReleaseNotes: true
          immutableCreate: true
