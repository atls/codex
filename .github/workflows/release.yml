name: Release

on:
  workflow_dispatch:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  vector-prime:
    name: Vector Prime
    if: github.ref == 'refs/heads/master'
    uses: atls/shared/.github/workflows/publish-semantic.yaml@master
    with:
      mode: github
      clientId: ${{ vars.ATLANTIS_SUPER_BOT_CLIENT_ID }}
      node-version-file: evals/model-fit/package.json
      python-version: '3.13'
    secrets:
      appPrivateKey: ${{ secrets.ATLANTIS_SUPER_BOT_PRIVATE_KEY }}
