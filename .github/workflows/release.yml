name: Release

on:
  push:
    branches: [master]
    paths:
      - 'plugins/**'
      - LICENSE
      - tools/build.py

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: astral-sh/ruff-action@v4.1.0
        with:
          version: '0.17.2'
          src: plugins/model-fit evals/model-fit tools
      - run: ruff format --check plugins/model-fit evals/model-fit tools
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: corepack enable
      - run: npm install --global @openai/codex@0.167.0-alpha.3.2
      - run: yarn install --immutable
        working-directory: evals/model-fit
      - run: yarn test
        working-directory: evals/model-fit
      - run: python tools/build.py
      - run: python -m unittest discover -s tools -p 'test_*.py'
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(python tools/build.py --version)"
          if git ls-remote --exit-code --tags origin "refs/tags/v${version}" >/dev/null; then
            echo "Release version v${version} already has a tag" >&2
            exit 1
          else
            lookup_status=$?
            if [ "$lookup_status" -ne 2 ]; then exit "$lookup_status"; fi
          fi
          gh release create "v${version}" dist/*.zip --target "$GITHUB_SHA" --title "Model Fit v${version}" --generate-notes
