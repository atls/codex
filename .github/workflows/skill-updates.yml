name: Update Model Fit

on:
  repository_dispatch:
    types: [skill-package-updated]

permissions:
  contents: read
  packages: read

concurrency:
  group: model-fit-package
  cancel-in-progress: false

jobs:
  update:
    if: startsWith(github.event.client_payload.tag, '@atls/skill-model-fit@') && github.actor == 'atlantis-courier[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Update declared skill packages
        working-directory: .github/packaging/skills
        env:
          SKILLS_NPM_TOKEN: ${{ github.token }}
        run: corepack yarn up -R '@atls/skill-*' --mode=update-lockfile

      - name: Install the locked skill package
        working-directory: .github/packaging/skills
        env:
          SKILLS_NPM_TOKEN: ${{ github.token }}
        run: corepack yarn install --immutable

      - name: Copy the policy into the plugin
        run: cp .github/packaging/skills/node_modules/@atls/skill-model-fit/references/assessment-policy.md skills/model-fit/references/assessment-policy.md

      - uses: actions/create-github-app-token@v3.2.0
        id: app-token
        with:
          client-id: ${{ vars.ATLANTIS_SUPER_BOT_CLIENT_ID }}
          private-key: ${{ secrets.ATLANTIS_SUPER_BOT_PRIVATE_KEY }}
          repositories: codex
          permission-contents: write
          permission-pull-requests: write

      - uses: peter-evans/create-pull-request@v8
        id: pull-request
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: automation/model-fit-package
          base: master
          add-paths: |
            .github/packaging/skills/yarn.lock
            skills/model-fit/references/assessment-policy.md
          commit-message: 'fix(model-fit): update the assessment policy'
          title: 'fix(model-fit): update the assessment policy'
          body: 'Update the locked Model Fit package and the policy shipped by Vector Prime.'
          delete-branch: true
          sign-commits: true

      - uses: peter-evans/enable-pull-request-automerge@v3
        if: steps.pull-request.outputs.pull-request-number != ''
        with:
          token: ${{ steps.app-token.outputs.token }}
          pull-request-number: ${{ steps.pull-request.outputs.pull-request-number }}
          merge-method: squash
