name: Package Vector Prime

on:
  workflow_call:
    inputs:
      revision:
        type: string
        required: true

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        name: [vector-prime, vector-prime-guidance]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.revision }}
      - name: Archive package
        run: python3 .github/packaging/build.py --distribution ${{ matrix.name }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/${{ matrix.name }}.zip
          if-no-files-found: error
