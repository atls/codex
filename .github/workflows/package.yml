name: Package Vector Prime

on:
  workflow_call:
    inputs:
      revision:
        type: string
        required: true

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: vector-prime
            inventory: .github/packaging/marketplace.files
          - name: vector-prime-guidance
            inventory: .github/packaging/directory/files
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.revision }}
      - name: Archive package
        run: >-
          xargs git archive --format=zip --output=${{ matrix.name }}.zip
          --prefix=${{ matrix.name }}/
          ${{ matrix.name == 'vector-prime-guidance' && '--add-file=.github/packaging/directory/plugin.json' || '' }}
          HEAD -- < ${{ matrix.inventory }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}.zip
          if-no-files-found: error
