name: Package Vector Prime

on:
  workflow_call:
    inputs:
      revision:
        type: string
        required: true

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: vector-prime
            exclude: ''
          - name: vector-prime-guidance
            exclude: |
              !.codex-plugin/
              !docs/
              !hooks/
              !scripts/
              !skills/model-fit/.gitignore
              !skills/model-fit/references/code-map.md
              !skills/model-fit/references/desktop-hook.md
              !src/vector_prime/application/answer/
              !src/vector_prime/application/handoff/
              !src/vector_prime/application/switch/
              !src/vector_prime/entrypoints/hooks/
              !src/vector_prime/infrastructure/adapters/filesystem/
              !src/vector_prime/infrastructure/adapters/runtime/
              !src/vector_prime/infrastructure/adapters/codex/answer.py
              !src/vector_prime/infrastructure/adapters/codex/chat_profile.py
              !src/vector_prime/infrastructure/adapters/codex/context.py
              !src/vector_prime/infrastructure/adapters/codex/conversation.py
              !src/vector_prime/infrastructure/adapters/codex/history.py
              !src/vector_prime/infrastructure/adapters/codex/hooks.py
              !src/vector_prime/infrastructure/adapters/codex/transport/reader.py
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.revision }}
          persist-credentials: false
      - name: Place the Guidance manifest at the package root
        if: matrix.name == 'vector-prime-guidance'
        uses: actions/github-script@v9
        with:
          script: await require('node:fs/promises').copyFile('.github/packaging/directory/plugin.json', 'plugin.json')
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ matrix.name }}
          path: |
            .
            !.git/
            !.github/
            !.agents/
            !.gitignore
            !CONTRIBUTING.md
            !evals/
            !release.config.mjs
            ${{ matrix.exclude }}
          include-hidden-files: true
          if-no-files-found: error
