name: Verify

on:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: astral-sh/ruff-action@v4.1.0
        with:
          version: '0.17.2'
          src: plugins/model-fit evals/model-fit tools
      - run: ruff format --check plugins/model-fit evals/model-fit tools
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm install --global @openai/codex@0.167.0-alpha.3.2
      - run: corepack yarn install --immutable
        working-directory: evals/model-fit
      - run: corepack yarn test
        working-directory: evals/model-fit
      - run: python tools/build.py
      - run: python -m unittest discover -s tools -p 'test_*.py'
