name: Verify

on:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.9'
      - uses: astral-sh/ruff-action@v4.1.0
        with:
          version: '0.17.2'
          src: plugins/model-fit evals/model-fit tools
      - run: ruff format --check plugins/model-fit evals/model-fit tools
      - run: python -m unittest discover -s evals/model-fit -p 'test_*.py'
      - run: python tools/build.py
