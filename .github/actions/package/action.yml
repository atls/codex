name: Package Model Fit
description: Assemble the declared Desktop distributions using standard file tools
inputs:
  output:
    description: Directory for the release archives
    required: true
runs:
  using: composite
  steps:
    - name: Assemble distributions
      shell: bash
      env:
        PACKAGE_OUTPUT: ${{ inputs.output }}
      run: |
        set -euo pipefail
        staging=$(mktemp -d)
        trap 'rm -rf "$staging"' EXIT
        mkdir -p "$PACKAGE_OUTPUT"
        output=$(cd "$PACKAGE_OUTPUT" && pwd)
        version=$(jq -er '.version' plugins/model-fit/.codex-plugin/plugin.json)
        test "$version" = "$(jq -er '.version' plugins/model-fit-guidance/plugin.json)"
        for variant in model-fit model-fit-guidance; do
          destination="$staging/$variant"
          mkdir -p "$destination"
          rsync -ar --exclude __pycache__ --exclude '*.pyc' \
            --files-from=".github/packaging/$variant.files" \
            plugins/model-fit/ "$destination/"
          if [ "$variant" = model-fit-guidance ]; then
            rsync -a plugins/model-fit-guidance/ "$destination/"
          fi
          cp LICENSE "$destination/LICENSE"
          test -z "$(find "$destination" -type l -print -quit)"
          rm -f "$output/$variant-$version.zip"
          (cd "$staging" && zip -qr "$output/$variant-$version.zip" "$variant")
        done
